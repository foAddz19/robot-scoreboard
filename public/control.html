<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Scoreboard</title>
  <style>
    :root {
      --accent: #ffcc00;
      --bg: #141414;
      --text: #ffffff;
      --gold: #ffcc00;
      --green: #18c964;
      --red: #e53935;
      --blue: #2196f3;
      --orange: #ff8a00;
      --gray: #777777;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
    }

    .box {
      padding: 22px;
      margin: 0;
      max-width: none;
    }

    .score-row {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 14px 0 20px;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1;
    }

    .time {
      margin: 12px 0;
      color: var(--gold);
      font-size: clamp(70px, 10vw, 112px);
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 24px rgba(255, 204, 0, 0.22);
    }

    .time.final-warning {
      color: #ff3434;
      text-shadow: 0 0 24px rgba(255, 52, 52, 0.55);
      animation: final-pulse 0.7s ease-in-out infinite alternate;
    }

    @keyframes final-pulse {
      from {
        filter: brightness(1);
      }

      to {
        filter: brightness(1.25);
      }
    }

    .shot-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 8px 0 4px;
    }

    .shot-readout {
      min-width: 174px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 204, 0, 0.25);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      color: #fff8d6;
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .shot-readout span {
      color: var(--gold);
    }

    #status {
      display: inline-flex;
      min-width: 128px;
      justify-content: center;
      margin: 8px 0 0;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #d7dce4;
      font-size: 24px;
      line-height: 1;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: -6px 0 18px;
    }

    .quick-links a {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff8d6;
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
      text-decoration: none;
    }

    button {
      min-width: 126px;
      min-height: 62px;
      padding: 14px 22px;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.22);
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    button:active {
      transform: translateY(2px);
      filter: brightness(0.92);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
      transform: none;
    }

    .green {
      background: var(--green);
    }

    .red {
      background: var(--red);
    }

    .blue {
      background: var(--blue);
    }

    .orange {
      background: var(--orange);
    }

    .gray {
      background: var(--gray);
    }

    @media (max-width: 560px) {
      body {
        padding: 14px;
      }

      .box {
        padding: 18px;
      }

      button {
        width: 100%;
      }
    }
  </style>
  <link rel="stylesheet" href="/brand.css">
</head>
<body>
  <main class="control-shell">
    <div class="brand-strip">
      <img class="brand-logo" src="/assets/robot-contest-logo.png" alt="R-VEC Robot Contest">
      <div class="event-title">
        <strong>ROBOT CONTEST</strong>
        <span>CONTROL PANEL</span>
      </div>
      <img class="brand-seal" src="/assets/vec-seal.png" alt="Vocational Education Commission">
    </div>

    <h1>ROBOT SCOREBOARD CONTROL</h1>
    <nav class="quick-links" aria-label="Setup pages">
      <a href="/team-names.html">TEAM NAME SETUP</a>
    </nav>

    <div class="control-grid">
      <section class="box">
        <div class="score-row">
          <div class="team-score"><span id="teamNameA">TEAM A</span>: <span id="scoreA">0</span></div>
          <div class="team-score"><span id="teamNameB">TEAM B</span>: <span id="scoreB">0</span></div>
        </div>

        <div class="time" id="time">00.00</div>
        <div class="shot-row">
          <div class="shot-readout">SHOT A: <span id="shotA">--.--</span></div>
          <div class="shot-readout">SHOT B: <span id="shotB">--.--</span></div>
        </div>
        <h2 id="status">STOP</h2>
      </section>

      <section class="box">
        <h2>ตั้งเวลาแข่งขัน</h2>
        <div class="button-row">
          <button class="blue" onclick="setTime(60)">1 นาที</button>
          <button class="blue" onclick="setTime(120)">2 นาที</button>
          <button class="blue" onclick="setTime(180)">3 นาที</button>
        </div>
      </section>

      <section class="box">
        <h2>ควบคุมเวลา</h2>
        <div class="button-row">
          <button class="green" onclick="startTime()">เริ่ม</button>
          <button class="red" onclick="stopTime()">หยุด</button>
        </div>
      </section>

      <section class="box">
        <h2>รีเซ็ต</h2>
        <div class="button-row">
          <button class="gray" id="resetScoreButton" onclick="resetScore()">RESET SCORE / SHOT</button>
          <button class="red" onclick="resetAll()">รีเซ็ตทั้งหมด</button>
        </div>
      </section>

      <section class="box">
        <h2>จบเกม +20</h2>
        <div class="button-row">
          <button class="orange" id="endTeamA" onclick="endMatch('A')">TEAM A +20 END</button>
          <button class="orange" id="endTeamB" onclick="endMatch('B')">TEAM B +20 END</button>
        </div>
      </section>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/final-warning.js"></script>
  <script>
    const socket = io();

    function setTime(seconds) {
      socket.emit("set-time", seconds);
    }

    function startTime() {
      if (typeof unlockWarningAudio === "function") unlockWarningAudio();
      socket.emit("start-time");
    }

    function stopTime() {
      socket.emit("stop-time");
    }

    function resetScore() {
      socket.emit("reset-score");
    }

    function resetAll() {
      socket.emit("reset-all");
    }

    function endMatch(team) {
      socket.emit("end-with-bonus", {
        team: team,
        point: 20
      });
    }

    socket.on("update", (data) => {
      document.getElementById("scoreA").innerText = data.scoreA;
      document.getElementById("scoreB").innerText = data.scoreB;
      document.getElementById("teamNameA").innerText = data.teamNameA || "TEAM A";
      document.getElementById("teamNameB").innerText = data.teamNameB || "TEAM B";
      document.getElementById("time").innerText = data.time;
      document.getElementById("shotA").innerText = data.shotA || "--.--";
      document.getElementById("shotB").innerText = data.shotB || "--.--";
      document.getElementById("status").innerText = data.status;
      document.getElementById("resetScoreButton").disabled = data.status === "RUNNING";
      document.getElementById("endTeamA").disabled = data.status === "FINISH" || data.shotA !== "";
      document.getElementById("endTeamB").disabled = data.status === "FINISH" || data.shotB !== "";
      if (typeof applyFinalWarning === "function") applyFinalWarning(data);
    });
  </script>
</body>
</html>
