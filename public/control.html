<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Scoreboard</title>
  <style>
    :root {
      --accent: #ffcc00;
      --bg: #141414;
      --text: #ffffff;
      --gold: #ffcc00;
      --green: #18c964;
      --red: #e53935;
      --blue: #2196f3;
      --gray: #777777;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
    }

    .box {
      padding: 22px;
      margin: 0;
      max-width: none;
    }

    .score-row {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 14px 0 20px;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1;
    }

    .time {
      margin: 12px 0;
      color: var(--gold);
      font-size: clamp(70px, 10vw, 112px);
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 24px rgba(255, 204, 0, 0.22);
    }

    #status {
      display: inline-flex;
      min-width: 128px;
      justify-content: center;
      margin: 8px 0 0;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #d7dce4;
      font-size: 24px;
      line-height: 1;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    button {
      min-width: 126px;
      min-height: 62px;
      padding: 14px 22px;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.22);
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    button:active {
      transform: translateY(2px);
      filter: brightness(0.92);
    }

    .green {
      background: var(--green);
    }

    .red {
      background: var(--red);
    }

    .blue {
      background: var(--blue);
    }

    .gray {
      background: var(--gray);
    }

    @media (max-width: 560px) {
      body {
        padding: 14px;
      }

      .box {
        padding: 18px;
      }

      button {
        width: 100%;
      }
    }
  </style>
  <link rel="stylesheet" href="/brand.css">
</head>
<body>
  <main class="control-shell">
    <div class="brand-strip">
      <img class="brand-logo" src="/assets/robot-contest-logo.png" alt="R-VEC Robot Contest">
      <div class="event-title">
        <strong>ROBOT CONTEST</strong>
        <span>CONTROL PANEL</span>
      </div>
      <img class="brand-seal" src="/assets/vec-seal.png" alt="Vocational Education Commission">
    </div>

    <h1>ROBOT SCOREBOARD CONTROL</h1>

    <div class="control-grid">
      <section class="box">
        <div class="score-row">
          <div class="team-score">TEAM A: <span id="scoreA">0</span></div>
          <div class="team-score">TEAM B: <span id="scoreB">0</span></div>
        </div>

        <div class="time" id="time">03:00</div>
        <h2 id="status">STOP</h2>
      </section>

      <section class="box">
        <h2>ตั้งเวลาแข่งขัน</h2>
        <div class="button-row">
          <button class="blue" onclick="setTime(60)">1 นาที</button>
          <button class="blue" onclick="setTime(120)">2 นาที</button>
          <button class="blue" onclick="setTime(180)">3 นาที</button>
        </div>
      </section>

      <section class="box">
        <h2>ควบคุมเวลา</h2>
        <div class="button-row">
          <button class="green" onclick="startTime()">เริ่ม</button>
          <button class="red" onclick="stopTime()">หยุด</button>
        </div>
      </section>

      <section class="box">
        <h2>รีเซ็ต</h2>
        <div class="button-row">
          <button class="gray" onclick="resetScore()">รีเซ็ตคะแนน</button>
          <button class="red" onclick="resetAll()">รีเซ็ตทั้งหมด</button>
        </div>
      </section>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function setTime(seconds) {
      socket.emit("set-time", seconds);
    }

    function startTime() {
      socket.emit("start-time");
    }

    function stopTime() {
      socket.emit("stop-time");
    }

    function resetScore() {
      socket.emit("reset-score");
    }

    function resetAll() {
      socket.emit("reset-all");
    }

    socket.on("update", (data) => {
      document.getElementById("scoreA").innerText = data.scoreA;
      document.getElementById("scoreB").innerText = data.scoreB;
      document.getElementById("time").innerText = data.time;
      document.getElementById("status").innerText = data.status;
    });
  </script>
</body>
</html>
