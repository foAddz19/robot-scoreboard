<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team B Score</title>
  <style>
    :root {
      --accent: #35b7ff;
      --accent-dark: #124765;
      --bg: #141414;
      --panel: #222;
      --panel-soft: #2d2d2d;
      --text: #fff;
      --muted: #bdbdbd;
      --gold: #ffcc00;
      --green: #18c964;
      --red: #e53935;
      --gray: #777;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background:
        linear-gradient(135deg, rgba(53, 183, 255, 0.12), transparent 38%),
        linear-gradient(225deg, rgba(255, 204, 0, 0.08), transparent 42%),
        var(--bg);
      color: var(--text);
      text-align: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
    }

    .panel {
      width: min(100%, 760px);
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      background: rgba(34, 34, 34, 0.96);
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.35);
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 44px;
      line-height: 1;
      margin: 0;
      letter-spacing: 0;
    }

    .status {
      min-width: 112px;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 22px;
      font-weight: bold;
      line-height: 1;
    }

    .status[data-state="RUNNING"] {
      background: rgba(24, 201, 100, 0.18);
      color: #50f091;
    }

    .status[data-state="FINISH"] {
      background: rgba(229, 57, 53, 0.18);
      color: #ff7a76;
    }

    .status[data-state="NO_SERVER"] {
      background: rgba(255, 204, 0, 0.18);
      color: #ffe072;
    }

    .score {
      min-height: 180px;
      display: grid;
      place-items: center;
      margin: 0 0 18px;
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
      border: 2px solid var(--accent-dark);
      color: var(--accent);
      font-size: 150px;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 0 24px rgba(53, 183, 255, 0.22);
    }

    .time {
      margin: 0 0 24px;
      padding: 12px;
      border-radius: 8px;
      background: #171717;
      color: var(--gold);
      font-size: 72px;
      font-weight: bold;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .time.final-warning {
      color: #ff3434;
      border-color: rgba(255, 52, 52, 0.7);
      text-shadow: 0 0 24px rgba(255, 52, 52, 0.55);
      animation: final-pulse 0.7s ease-in-out infinite alternate;
    }

    @keyframes final-pulse {
      from {
        filter: brightness(1);
      }

      to {
        filter: brightness(1.25);
      }
    }

    .shot-readout {
      margin: 0 0 18px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 204, 0, 0.25);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      color: #fff8d6;
      font-size: 36px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .shot-readout span {
      color: var(--gold);
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .timer-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      min-height: 82px;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 34px;
      font-weight: 800;
      line-height: 1;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.22);
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    button:active {
      transform: translateY(2px);
      filter: brightness(0.92);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
      transform: none;
    }

    .plus {
      background: var(--green);
    }

    .minus {
      background: var(--red);
    }

    .start {
      background: #2196f3;
    }

    .stop {
      background: #f05a38;
    }

    .end {
      grid-column: 1 / -1;
      background: #ff8a00;
    }

    .reset {
      min-height: 70px;
      margin-top: 16px;
      background: var(--gray);
      font-size: 26px;
    }

    @media (max-width: 560px) {
      body {
        padding: 14px;
      }

      .panel {
        padding: 18px;
      }

      .top-row {
        align-items: flex-start;
      }

      h1 {
        font-size: 34px;
      }

      .status {
        min-width: 96px;
        font-size: 18px;
      }

      .score {
        min-height: 142px;
        font-size: 112px;
      }

      .time {
        font-size: 54px;
      }

      .shot-readout {
        font-size: 28px;
      }

      button {
        min-height: 68px;
        font-size: 28px;
      }

      .reset {
        min-height: 64px;
        font-size: 22px;
      }
    }
  </style>
  <link rel="stylesheet" href="/brand.css">
  <style>
    body.team-b-page:has(.panel) .top-row {
      grid-column: 1;
      grid-row: 2;
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: clamp(14px, 2vw, 20px);
      padding: 0 clamp(16px, 2.5vw, 28px);
      transform: translateY(clamp(10px, 1.8vh, 18px));
    }

    body.team-b-page:has(.panel) .status {
      justify-self: end;
      min-width: clamp(96px, 12vw, 128px);
      text-align: center;
    }

    body.team-b-page:has(.panel) .team-tag {
      justify-self: start;
      max-width: 100%;
      overflow-wrap: anywhere;
      text-align: left;
      white-space: normal;
    }

    @media (max-width: 560px) {
      body.team-b-page:has(.panel) .top-row {
        grid-template-columns: 1fr;
        row-gap: 8px;
        height: auto;
        overflow: visible;
        transform: none;
      }

      body.team-b-page:has(.panel) .status,
      body.team-b-page:has(.panel) .team-tag {
        justify-self: center;
      }
    }
  </style>
</head>
<body class="team-b-page">

  <main class="panel">
    <div class="brand-strip">
      <img class="brand-logo" src="/assets/robot-contest-logo.png" alt="R-VEC Robot Contest">

      <div class="event-title">
        <strong>VEC Service Intelligence Robot</strong>
        <span>LIVE SCOREBOARD</span>
      </div>

      <img class="brand-seal" src="/assets/vec-seal.png" alt="Vocational Education Commission">
    </div>

    <div class="top-row">
      <h1 class="team-tag" id="teamNameB">TEAM B</h1>
      <div class="status" id="status" data-state="STOP">STOP</div>
    </div>

    <div class="score" id="scoreB">0</div>
    <div class="time" id="time">00.00</div>
    <div class="shot-readout">SHOT <span id="shotB">--.--</span></div>

    <div class="timer-grid">
      <button class="start" id="startTimeButton">START</button>
      <button class="stop" id="stopTimeButton">STOP</button>
    </div>

    <div class="button-grid">
      <button class="plus" data-score="5">+5</button>
      <button class="plus" data-score="10">+10</button>
      <button class="plus" data-score="20">+20</button>
      <button class="minus" data-score="-5">-5</button>
      <button class="minus" data-score="-10">-10</button>
      <button class="minus" data-score="-20">-20</button>
      <button class="end" id="endMatchButton">+20 END</button>
    </div>

    <button class="reset" id="resetScoreButton">RESET SCORE / SHOT</button>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/final-warning.js"></script>
  <script>
    const status = document.getElementById("status");
    const buttons = document.querySelectorAll("button");

    function setButtonsEnabled(enabled) {
      buttons.forEach((button) => {
        button.disabled = !enabled;
      });
    }

    function setScoreButtonsEnabled(enabled) {
      document.querySelectorAll("[data-score], #endMatchButton").forEach((button) => {
        button.disabled = !enabled;
      });
    }

    function showOffline() {
      status.innerText = "NO SERVER";
      status.dataset.state = "NO_SERVER";
      setButtonsEnabled(false);
    }

    function addScore(socket, point) {
      socket.emit("add-score", {
        team: "B",
        point: point
      });
    }

    if (typeof io !== "function") {
      showOffline();
    } else {
      const socket = io();

      setButtonsEnabled(false);

      document.getElementById("startTimeButton").addEventListener("click", () => {
        if (typeof unlockWarningAudio === "function") unlockWarningAudio();
        socket.emit("start-time");
      });

      document.getElementById("stopTimeButton").addEventListener("click", () => {
        socket.emit("stop-time");
      });

      document.getElementById("resetScoreButton").addEventListener("click", () => {
        socket.emit("reset-score");
      });

      document.getElementById("endMatchButton").addEventListener("click", () => {
        socket.emit("end-with-bonus", {
          team: "B",
          point: 20
        });
      });

      document.querySelectorAll("[data-score]").forEach((button) => {
        button.addEventListener("click", () => {
          addScore(socket, Number(button.dataset.score));
        });
      });

      socket.on("connect", () => {
        setButtonsEnabled(true);
      });

      socket.on("disconnect", showOffline);
      socket.on("connect_error", showOffline);

      socket.on("update", (data) => {
        document.getElementById("scoreB").innerText = data.scoreB;
        document.getElementById("teamNameB").innerText = data.teamNameB || "TEAM B";
        document.getElementById("time").innerText = data.time;
        document.getElementById("shotB").innerText = data.shotB || "--.--";
        status.innerText = data.status;
        status.dataset.state = data.status;
        document.getElementById("resetScoreButton").disabled = data.status === "RUNNING";
        setScoreButtonsEnabled(data.status !== "FINISH" && data.shotB === "");
        if (typeof applyFinalWarning === "function") applyFinalWarning(data);
      });
    }
  </script>

</body>
</html>
